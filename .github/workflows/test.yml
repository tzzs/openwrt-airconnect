# Host test gate for openwrt-airconnect.
#
# This workflow only proves what a Linux host can prove: the ucode modules, the
# packaged shell scripts and the LuCI view's validation rules. It does NOT build
# OpenWrt packages, does NOT download the 95 MB AirConnect release archive and
# does NOT talk to a router. See docs/TESTING.zh-CN.md for what is still a
# manual gate.
name: Host tests

on:
  push:
  pull_request:
  # Manual reruns are useful when a dependency mirror is temporarily flaky.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: host-tests
    runs-on: ubuntu-latest
    env:
      # Installed ucode prefix. scripts/run-tests.sh resolves the module
      # directory as <prefix>/lib/ucode next to the binary.
      UCODE_PREFIX: ${{ github.workspace }}/.ucode
      # Upstream revision the interpreter is built from. Pinned to a commit, not
      # a branch: the suites must not drift with whatever master happens to be.
      # The last release tag (v0.0.20250529) predates syntax the suites and the
      # shipped modules rely on, so the pin is a commit rather than a tag.
      UCODE_REF: aabdeb4f5060c91c5929bf6d7af745c6aabf5ec5
      # Short label used in cache keys and step names.
      UCODE_LABEL: aabdeb4f
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned major. The repository has no npm dependencies; node only
          # executes the plain .mjs file.
          node-version: 20

      - name: Install build dependencies for ucode
        # json-c is a hard build requirement of ucode itself. libmd provides the
        # pkg-config file ucode's optional digest module requires; keeping it
        # enabled makes CI build the same interpreter the suites are developed
        # against locally (runtime.uc falls back to its own digest without it).
        # cmake, make and gcc are already present on ubuntu-latest.
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libjson-c-dev libmd-dev gettext

      - name: Cache the ucode build
        id: ucode-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UCODE_PREFIX }}
          # The suffix changes when the pinned revision or compatibility flags
          # change; never reuse an interpreter built another way.
          key: ucode-${{ runner.os }}-${{ env.UCODE_LABEL }}-3

      - name: Build ucode ${{ env.UCODE_LABEL }}
        if: steps.ucode-cache.outputs.cache-hit != 'true'
        env:
          # Fetch the pinned commit rather than a tag: the suites rely on
          # behaviour that only exists after the last release tag.
          UCODE_URL: https://github.com/jow-/ucode/archive/${{ env.UCODE_REF }}.tar.gz
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ucode/lib
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          curl -fsSL --retry 3 --retry-delay 2 -o "$work/ucode.tar.gz" "$UCODE_URL"
          mkdir -p "$work/src"
          tar -xzf "$work/ucode.tar.gz" --strip-components=1 -C "$work/src"

          cmake -S "$work/src" -B "$work/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$UCODE_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_FLAGS=-Wno-error=discarded-qualifiers
          cmake --build "$work/build" --parallel
          cmake --install "$work/build"

          # Fail here, not inside the suites, if the interpreter is unusable.
          "$UCODE_PREFIX/bin/ucode" -e 'print("ucode ok\n")'

      - name: Verify the cached interpreter
        if: steps.ucode-cache.outputs.cache-hit == 'true'
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ucode/lib
        run: |
          set -eu
          test -x "$UCODE_PREFIX/bin/ucode"
          test -d "$UCODE_PREFIX/lib/ucode"
          "$UCODE_PREFIX/bin/ucode" -e 'print("ucode ok\n")'

      - name: Run the host test suites
        env:
          UCODE: ${{ env.UCODE_PREFIX }}/bin/ucode
          LD_LIBRARY_PATH: ${{ github.workspace }}/.ucode/lib
        # One command, and it fails the job when any suite fails. Suites are
        # discovered by convention inside the script.
        run: bash scripts/run-tests.sh
